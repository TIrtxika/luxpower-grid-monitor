# WireGuard Server Configuration (VPS)
# File: /etc/wireguard/wg0.conf

[Interface]
# VPS server address in VPN network
Address = 10.10.0.1/24

# WireGuard port (change if needed)
ListenPort = 51820

# Private key (generate with: wg genkey)
PrivateKey = YOUR_VPS_PRIVATE_KEY_HERE

# Optional: Enable IP forwarding
PostUp = sysctl -w net.ipv4.ip_forward=1
PostDown = sysctl -w net.ipv4.ip_forward=0

# Peer: Raspberry Pi
[Peer]
# RPi public key (from: wg pubkey < rpi_private.key)
PublicKey = YOUR_RPI_PUBLIC_KEY_HERE

# RPi address in VPN network
AllowedIPs = 10.10.0.2/32

# Optional: Keep connection alive (important for NAT)
PersistentKeepalive = 25
