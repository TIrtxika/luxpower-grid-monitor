# WireGuard Client Configuration (Raspberry Pi)
# File: /etc/wireguard/wg0.conf

[Interface]
# RPi address in VPN network
Address = 10.10.0.2/24

# Private key (generate with: wg genkey)
PrivateKey = YOUR_RPI_PRIVATE_KEY_HERE

# Optional: DNS server (use VPS or public DNS)
# DNS = 10.10.0.1

# Peer: VPS Server
[Peer]
# VPS public key (from: wg pubkey < vps_private.key)
PublicKey = YOUR_VPS_PUBLIC_KEY_HERE

# VPS endpoint (your VPS public IP and WireGuard port)
Endpoint = YOUR_VPS_PUBLIC_IP:51820

# Route only VPN traffic (not all traffic)
AllowedIPs = 10.10.0.0/24

# Keep connection alive (important for NAT traversal)
PersistentKeepalive = 25
