name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vps:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: vps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # same minor version as the VPS (Debian 12)
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vps/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: python -m unittest discover -s . -p 'test_*.py' -v
